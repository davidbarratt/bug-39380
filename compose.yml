services:
  # The "app" service — initially IPv4 only, like pre-fix flex
  server:
    build:
      context: .
      target: server
    command: node server.js 0.0.0.0   # Change to "::" to test the fix
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 2s
      retries: 5

  # Test container shares the server's loopback — exactly like flex
  test:
    build:
      context: .
      target: test
    network_mode: service:server
    depends_on:
      server: { condition: service_healthy }
    environment:
      - CI=true
