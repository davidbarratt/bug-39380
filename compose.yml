services:
  # The "app" service — initially IPv4 only
  server:
    build:
      context: .
      target: server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 2s
      retries: 5

  # Test container shares the server's loopback
  test:
    build:
      context: .
      target: test
    network_mode: service:server
    depends_on:
      server: { condition: service_healthy }
    environment:
      - CI=true
